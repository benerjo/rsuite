[workspace]
resolver = "2"
members = [
    "a440",
    "activator",
    "chorus",
    "distortion",
    "kick",
    "loop",
    "metronome",
    "mididebug",
    "recorder",
    "reverb",
    "rsuite",
    "rsynth",
    "smooth",
    "snare",
    "transposer",
]

[workspace.package]
authors = ["Benerjo <benerjo@gmail.com>"]
edition = "2021"
license = "GPLv3"
version = "0.0.1"

[workspace.dependencies]
rsuite = { path = "rsuite" }
jack-sys = "0.5"
libc = "0.2"
jack = "0.13"
riff = "2.0"
eframe = "0.35.0"
winit = "0.30"
egui_plot = "0.36.0"
chrono = "0.4"
rand = "0.10"
enum-iterator = "2.3"
